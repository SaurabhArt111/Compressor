services:
  compressor:
    build: .
    image: compressor:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      # Comma-separated list of allowed origins if the app is served from a
      # different origin than it's accessed from (reverse proxy setups).
      # Leave unset ("*") for same-origin / typical self-hosted use.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648} # 2GB
      MAX_SERVER_CONCURRENCY: ${MAX_SERVER_CONCURRENCY:-4}
      JOB_RETENTION_MS: ${JOB_RETENTION_MS:-86400000} # 24h
    volumes:
      - compressor-uploads:/app/server/uploads
      - compressor-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  compressor-uploads:
  compressor-data:
